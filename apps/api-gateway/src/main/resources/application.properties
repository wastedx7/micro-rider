spring.application.name=api-gateway
server.port=8080

# env import line :
spring.config.import=optional:file:.env[.properties]

# jwt config :
security.jwt.secret-key=${SECRET_KEY:}
security.jwt.expiration-ms=8640000
security.jwt.issuer=${JWT_ISSUER:micro-rider-user-service}

# service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# gRPC clients (static addresses for local dev; DiscoveryClient later)
spring.grpc.client.ride-service.address=static://127.0.0.1:9081
spring.grpc.client.websocket-server-rider.address=static://127.0.0.1:9100
spring.grpc.client.websocket-server-driver.address=static://127.0.0.1:9101

# Gateway routes. Service URLs are configurable for local Docker or direct JVM runs.
spring.cloud.gateway.routes[0].id=user-service
spring.cloud.gateway.routes[0].uri=${USER_SERVICE_URI:http://localhost:8085}
spring.cloud.gateway.routes[0].predicates[0]=Path=/auth/**

spring.cloud.gateway.routes[1].id=ride-service
spring.cloud.gateway.routes[1].uri=${RIDE_SERVICE_URI:http://localhost:8081}
spring.cloud.gateway.routes[1].predicates[0]=Path=/rides/**
spring.cloud.gateway.routes[1].filters[0]=UUIDHeaderGateway

spring.cloud.gateway.routes[2].id=location-service
spring.cloud.gateway.routes[2].uri=${LOCATION_SERVICE_URI:http://localhost:8082}
spring.cloud.gateway.routes[2].predicates[0]=Path=/locations/**
spring.cloud.gateway.routes[2].filters[0]=UUIDHeaderGateway

spring.cloud.gateway.routes[3].id=driver-assignment-service
spring.cloud.gateway.routes[3].uri=${ASSIGNMENT_SERVICE_URI:http://localhost:8083}
spring.cloud.gateway.routes[3].predicates[0]=Path=/assignments/**
spring.cloud.gateway.routes[3].filters[0]=UUIDHeaderGateway

spring.cloud.gateway.routes[4].id=notification-service
spring.cloud.gateway.routes[4].uri=${NOTIFICATION_SERVICE_URI:http://localhost:8084}
spring.cloud.gateway.routes[4].predicates[0]=Path=/notifications/**
spring.cloud.gateway.routes[4].filters[0]=UUIDHeaderGateway

spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
