spring.application.name=location-service
server.port=8082

# service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.ridehailing.common.kafka.ProtobufDeserializer
spring.kafka.consumer.properties.protobuf.message.class=com.ridehailing.proto.location.DriverLocationUpdate

# redis (driver location cache, used from Phase 6)
spring.data.redis.host=localhost
spring.data.redis.port=6379