spring.application.name=user-service
server.port=8085
spring.config.import=optional:file:.env[.properties]
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
security.jwt.issuer=${JWT_ISSUER:micro-rider-user-service}
security.jwt.secret-key=${SECRET_KEY:}
security.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/micro_rider}
spring.datasource.username=${DATABASE_USERNAME:ride}
spring.datasource.password=${DATABASE_PASSWORD:ride}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
