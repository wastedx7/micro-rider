spring.application.name=ride-service
server.port=8081
spring.grpc.server.port=9081

# service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=com.ridehailing.common.kafka.ProtobufSerializer

# Supabase PostgreSQL connection. Set SUPABASE_DB_URL, SUPABASE_DB_USERNAME,
# and SUPABASE_DB_PASSWORD in the environment; no credentials belong in git.
spring.datasource.url=${SUPABASE_DB_URL:jdbc:postgresql://localhost:5432/micro_rider}
spring.datasource.username=${SUPABASE_DB_USERNAME:ride}
spring.datasource.password=${SUPABASE_DB_PASSWORD:ride}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
