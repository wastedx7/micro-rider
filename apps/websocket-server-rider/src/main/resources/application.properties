spring.application.name=websocket-server-rider
server.port=8090
spring.grpc.server.port=9100

# service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.ridehailing.common.kafka.ProtobufDeserializer
spring.kafka.consumer.properties.protobuf.message.class=com.ridehailing.proto.ride.RideStatusChangeEvent