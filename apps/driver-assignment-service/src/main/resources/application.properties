spring.application.name=driver-assignment-service
server.port=8083

# service discovery
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.instance.prefer-ip-address=true

# gRPC client to notification-service (static address for local dev; DiscoveryClient later)
spring.grpc.client.notification-service.address=static://127.0.0.1:9084

# kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=com.ridehailing.common.kafka.ProtobufDeserializer
spring.kafka.consumer.properties.protobuf.message.class=com.ridehailing.proto.assignment.DriverAssignmentRequest

# redis (distributed lock, used from Phase 7)
spring.data.redis.host=localhost
spring.data.redis.port=6379