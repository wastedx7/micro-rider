syntax = "proto3";

package com.ridehailing.proto.common;

option java_multiple_files = true;
option java_package = "com.ridehailing.proto.common";
option java_outer_classname = "CommonProto";

message RequestContext {
  string request_id = 1;
  string user_id = 2;
  repeated string roles = 3;
}

message ErrorDetail {
  string code = 1;
  bool retryable = 2;
  string correlation_id = 3;
  string field = 4;
}

message OperationResponse {
  bool accepted = 1;
  string request_id = 2;
  string message = 3;
}
